[package]
name = "assetify"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Portable asset access: declare the files you need and how you'll read them; get verified, cached, offline-capable local assets behind generic access traits."
repository = "https://github.com/velocitysystems/assetify"
readme = "README.md"

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]
test-util = []

[dependencies]
async-trait = "0.1"
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
assetify = { path = ".", default-features = false, features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
