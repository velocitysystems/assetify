[package]
name = "assetify"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Declare your assets; assetify fetches, verifies, caches, and serves them — as a stream, random access, or a path, online or offline."
repository = "https://github.com/velocitysystems/assetify"
readme = "README.md"

[features]
default = ["mmap"]
http = ["dep:reqwest"]
mmap = ["dep:memmap2"]
test-util = []

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
memmap2 = { version = "0.9.11", optional = true }
reqwest = { version = "0.12.9", default-features = false, features = [
   "rustls-tls",
], optional = true }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync"] }

[dev-dependencies]
assetify = { path = ".", default-features = false, features = ["test-util"] }
hex = "0.4.3"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.2"
