[package]
name = "assetify"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
description = "Declare your assets; assetify fetches, verifies, caches, and serves them — as a stream, random access, or a path, online or offline."
repository = "https://github.com/velocitysystems/assetify"
readme = "README.md"
exclude = ["/demos"]
keywords = ["assets", "cache", "offline", "download", "mmap"]
categories = ["caching", "filesystem", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "http_assets"
required-features = ["http"]

[features]
default = ["mmap"]
http = ["dep:reqwest"]
mmap = ["dep:memmap2"]
test-util = []

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
memmap2 = { version = "0.9.11", optional = true }
reqwest = { version = "0.12.9", default-features = false, features = [
   "rustls-tls",
], optional = true }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync"] }
tracing = "0.1.41"

[dev-dependencies]
assetify = { path = ".", default-features = false, features = ["test-util"] }
hex = "0.4.3"
rand = "0.9.1"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.19"
wiremock = "0.6.2"
