[package]
name = "tauri-demo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "tauri_demo"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
assetify = { path = "../../.." }
tauri = { version = "2.11.5", features = [] }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
